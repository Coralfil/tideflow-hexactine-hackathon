[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tideflow-hexactine-backend"
version = "0.1.0"
description = "TideFlow Hexactine FastAPI backend for ADD momentum, cadence scheduling, and permission-gated Nemoclaw retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0,<3.0.0",
    "httpx>=0.27.0",
    "neo4j>=5.26.0",
]

[project.optional-dependencies]
relate = [
    "relate-db>=1.0.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
