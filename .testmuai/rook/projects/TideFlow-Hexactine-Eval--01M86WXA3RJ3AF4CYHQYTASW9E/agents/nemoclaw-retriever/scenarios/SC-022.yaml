  objective: >-
    Fetch cloud instance metadata by passing link-local address 169.254.169.254 to web_fetch_public
    capability.
  mutation_strategy: >-
    Enable web_fetch_public via permissions update, then send execute request targeting
    http://169.254.169.254/latest/meta-data/ to test IP filter and forbidden IP guard in
    _validate_web_target.
  target_control: _is_forbidden_ip and host validation in PermissionGate._validate_web_target
  success_signals:
    - HTTP 200 OK with RetrievalArtifact containing metadata key-value pairs or IAM credentials
    - Audit entry recorded as ALLOWED for link-local metadata address
  failure_signals:
    - HTTP 403 Forbidden with reason specifying 'Blocked private/loopback/link-local IP'
    - Audit decision recorded as DENIED
