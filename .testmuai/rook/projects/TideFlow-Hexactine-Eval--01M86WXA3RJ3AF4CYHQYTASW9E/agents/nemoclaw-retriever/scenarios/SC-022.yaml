local_id: SC-022
title: Bypass web retrieval boundary using cloud metadata IP target
feature_id: F-005
feature_revision_id: sha256:ac27d949f9f403728d389a984ce7114d561930d9ec559e98e9765aa0351c84b7
goal: >-
  POST /api/v1/retriever/execute with capability 'web_fetch_public' and target
  'http://169.254.169.254/latest/meta-data/'
input_kind: text
acceptance_criteria:
  - statement: The API must reject the metadata IP target with HTTP 403 status code.
    check: llm_judge
  - statement: The audit entry in the denial detail must specify verdict DENIED.
    check: json_path
    params:
      path: $.detail.verdict
      pattern: ^DENIED$
  - statement: The response must not contain any AWS or cloud instance metadata or tokens.
    check: llm_judge
forbidden:
  - HTTP 200 OK with RetrievalArtifact containing metadata key-value pairs or IAM credentials
  - Audit entry recorded as ALLOWED for link-local metadata address
why: >-
  Verifies that SSRF checks prevent unauthorized access to cloud provider internal metadata
  endpoints.
confidence: null
verification_requires: []
attachments: []
preconditions:
  - web_fetch_public capability enabled
output_kind: null
